# Planetiler custommap schema for GRID3 DRC (COD) administrative, settlement,
# health-facility, and roads layers.
#
# Derived from:
#   - planetiler/reports/ogrreport_202608191340.json (field/geometry inventory)
#   - planetiler/reports/ogrreport_202608191438.json (roads field/geometry inventory)
#   - preprocessing/profiles/cod/layers.yaml           (v9.0 layer ids, min/maxzoom, DOIs)
#   - preprocessing/dictionaries/tile_layer_steps.json (zoom-stepped attribute filters)
#   - preprocessing/dictionaries/layer_metadata.json   (attribution/license precedent)
#   - pmtiles/app/src/style.json                       (confirms layer id "GRID3-COD-roads-v1-0"
#     and attribute "class" are already relied on downstream by the road paint rules)
# against planetiler/schema/specifications/planetiler.schema.json and
# https://github.com/onthegomap/planetiler/tree/main/planetiler-custommap
#
# IMPORTANT — source format:
# Planetiler custommap only reads `osm`, `shapefile`, `geopackage`, or `geojson`
# sources; FlatGeobuf is not supported. Convert each input .fgb to GeoPackage
# before running planetiler, e.g.:
#
#   for f in *.fgb; do
#     ogr2ogr -f GPKG "${f%.fgb}.gpkg" "$f"
#   done
#
# All inputs are already EPSG:4326 (confirmed via ogrinfo), so no reprojection
# or `projection:` override is needed.
#
# NOTE — derived centroids: the separately pre-computed `*_centroids` inputs
# (province/antenne/zonesante/airesante) are no longer needed. Those layers now
# use `geometry: polygon_centroid_if_convex` directly on the polygon sources —
# it emits the true centroid for convex polygons and falls back to an interior
# point for concave ones, so the label point always lands inside the shape.
# One tradeoff: the precomputed centroid files carried an Esri-derived
# `label_rotation` field with no equivalent computable from the polygon alone,
# so that attribute is dropped from these layers.
#
# NOTE — no per-layer maxzoom: unlike tippecanoe's per-`-L` maxzoom, planetiler
# custommap has no per-feature/per-layer max_zoom concept — only a single global
# `--maxzoom` (see `args.maxzoom` below). The tippecanoe profile capped boundary
# layers at z14 and POI layers at z16; here the global maxzoom is set to 16 so
# POIs get full detail, and boundary/settlement layers simply carry their z16
# geometry unchanged past z14 (harmless — vector tile clients overzoom anyway,
# it just costs a little extra generation time/tile size at z15-16).
#
# NOTE — roads layer: the source file is renamed from the awkward
# `GRID3_COD_roads_v1_0_4326.fgb` to `GRID3_COD_roads_v1_0.gpkg` during
# conversion (the "_4326" EPSG suffix is redundant — every input here is
# already EPSG:4326). The layer id `GRID3-COD-roads-v1-0` and the `class`
# attribute are kept exactly as-is because pmtiles/app/src/style.json already
# paints against them (grid3-cod-tracks, grid3-cod-roads-minor, etc.).
# Zoom-stepping by `class` reuses the already-vetted "roads" zoom_filter_windows
# from tile_layer_steps.json, restructured as a match with a catch-all
# "otherwise" at z11 so track/path/unclassified/residential (and any future,
# currently-unlisted class) all render starting at z11 as requested; only
# higher-priority classes (motorway/trunk/primary/secondary/tertiary) get an
# earlier explicit zoom, and service/steps are pushed to z13. Feature count is
# aggressively cut via `tile_post_process.merge_line_strings`, which fuses
# contiguous same-attribute segments (this dataset carries Overture GERS-style
# road segmentation, so many of the 1.86M rows are short fragments of the same
# logical road) and drops merged segments under ~2px below max zoom. Per-
# planetiler's schema, feature-level `min_size`/`tolerance` are ignored once a
# layer defines `tile_post_process`, so simplification is controlled solely
# through the tile_post_process block here.

schema_name: "GRID3 DRC (COD) Administrative, Settlement & Roads Layers v9.0"
schema_description: >-
  Administrative boundaries (province, antenne, health zone, health area),
  settlement extents, health facilities, settlement-name points, and roads
  for the Democratic Republic of the Congo, produced by GRID3 / CIESIN.
attribution: "© The Trustees of Columbia University in the City of New York. CC BY-SA 4.0."
version: "9.0"
is_overlay: true

args:
  data_dir:
    type: string
    default: "/tmp/grid3_tiles/data/2-scratch/grid3/cod/gpkg"
    description: "Directory of GeoPackage source data."
  # maxzoom:
  #   default: 16

definitions:
  attributes:
    - &attr_pays { key: pays, type: string }
    - &attr_iso3 { key: iso3, type: string }
    - &attr_province { key: province, type: string }
    - &attr_prov_uid { key: prov_uid, type: string }
    - &attr_antenne { key: antenne, type: string }
    - &attr_zonesante { key: zonesante, type: string }
    - &attr_zs_uid { key: zs_uid, type: string }
    - &attr_airesante { key: airesante, type: string }
    - &attr_as_uid { key: as_uid, type: string }
    - &attr_date { key: date, type: string }
    - &attr_edit_par { key: edit_par, type: string }
    - &attr_grid3id { key: grid3id, type: string }
    - &attr_source_acronym { key: source_acronym, type: string }
    - &attr_sourceid { key: sourceid, type: string }
    - &attr_area_km2 { key: area_km2, value: '${ feature.area("km2") }', type: double }

sources:
  cod_province:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_province_v9_0.gpkg" }'
  cod_antenne:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_antenne_v9_0.gpkg" }'
  cod_zonesante:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_zonesante_v9_0.gpkg" }'
  cod_airesante:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_airesante_v9_0.gpkg" }'
  cod_settlement_blocks:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_settlement_blocks_v4_0.gpkg" }'
  cod_settlement_extents:
    type: geopackage
    # Produced by preprocessing/utilities/dissolveBlocks_COD_duckdb.py, which
    # dissolves cod_settlement_blocks by mgrs_code with proper SUM/AVG/MIN/MAX
    # aggregation (the same pattern already used for NGA in
    # dissolveBlocks_NGA_duckdb.py). Not a raw ogr2ogr conversion of an .fgb —
    # this file must be generated by that script.
    local_path: '${ args.data_dir + "/GRID3_COD_settlement_extents_v4_0.gpkg" }'
  cod_health_facilities:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_health_facilities_v9_0.gpkg" }'
  cod_settlement_names:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_settlement_names_v9_0.gpkg" }'
  cod_roads:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_roads_v1_0.gpkg" }'

layers:

  # ── Administrative boundaries ──────────────────────────────────────────────
  # DOIs: 10.7916/06qw-9y10, 10.7916/hv5g-p227 (published 2026-01-13)

  - id: GRID3-COD-province-v9-0
    features:
      - geometry: polygon
        source: cod_province
        min_zoom: 3
        attributes:
          - *attr_province
          - *attr_pays
          - *attr_iso3
          - *attr_prov_uid
          - *attr_date
          - *attr_edit_par
          - *attr_grid3id

  - id: GRID3-COD-province-v9-0-centroids
    features:
      - geometry: polygon_centroid_if_convex
        source: cod_province
        min_zoom: 3
        attributes:
          - *attr_province
          - *attr_pays
          - *attr_iso3
          - *attr_prov_uid
          - *attr_date
          - *attr_edit_par
          - *attr_grid3id
          - *attr_area_km2

  - id: GRID3-COD-antenne-v9-0
    features:
      - geometry: polygon
        source: cod_antenne
        min_zoom: 3
        attributes:
          - *attr_antenne
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_date
          - *attr_edit_par
          - *attr_grid3id

  - id: GRID3-COD-antenne-v9-0-centroids
    features:
      - geometry: polygon_centroid_if_convex
        source: cod_antenne
        min_zoom: 3
        attributes:
          - *attr_antenne
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_date
          - *attr_edit_par
          - *attr_grid3id
          - *attr_area_km2

  - id: GRID3-COD-zonesante-v9-0
    features:
      - geometry: polygon
        source: cod_zonesante
        min_zoom: 5
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_date
          - *attr_source_acronym
          - *attr_sourceid
          - *attr_edit_par
          - *attr_grid3id

  - id: GRID3-COD-zonesante-v9-0-centroids
    features:
      - geometry: polygon_centroid_if_convex
        source: cod_zonesante
        min_zoom: 5
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_date
          - *attr_source_acronym
          - *attr_sourceid
          - *attr_edit_par
          - *attr_grid3id
          - *attr_area_km2

  - id: GRID3-COD-airesante-v9-0
    features:
      - geometry: polygon
        source: cod_airesante
        min_zoom: 7
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_airesante
          - *attr_as_uid
          - key: asnom_alt
            type: string
          - *attr_date
          - *attr_source_acronym
          - *attr_sourceid
          - *attr_edit_par
          - *attr_grid3id

  - id: GRID3-COD-airesante-v9-0-centroids
    features:
      - geometry: polygon_centroid_if_convex
        source: cod_airesante
        min_zoom: 7
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_airesante
          - *attr_as_uid
          - key: asnom_alt
            type: string
          - *attr_date
          - *attr_source_acronym
          - *attr_sourceid
          - *attr_edit_par
          - *attr_grid3id
          - *attr_area_km2

  # ── Settlement extents / blocks ────────────────────────────────────────────
  # DOI: 10.7916/bb5b-9b79 (v4.0, published 2026-04-03) for both layers below.
  #
  # Two-tier split, mirroring the NGA precedent already in
  # pmtiles/app/src/style.json (GRID3-NGA-settlement-extents-v4-0 at z7-14
  # crossfading into GRID3-NGA-settlement-blocks-v4-0 at z11+) and the old
  # tippecanoe layers.yaml GRID3_COD_settlement_blocks group (minzoom 11):
  #
  #   - GRID3-COD-settlement-blocks-v4-0: the raw per-block data (1.15M rows,
  #     one polygon per building cluster), z11+ only — "this existing paradigm
  #     .. used at larger scales only (>~11)".
  #   - GRID3-COD-settlement-extents-v4-0: a generalized z7-10 view, one
  #     polygon per mgrs_code, produced by dissolving+aggregating the blocks
  #     layer ahead of time (see cod_settlement_extents source
  #     above). Planetiler's tile_post_process.merge_polygons only fuses
  #     polygons that already share an identical attribute set within a single
  #     output tile — it can't compute cross-feature aggregates (sums/means)
  #     or dissolve across tile boundaries, so a true group-by-mgrs_code
  #     dissolve has to happen as a preprocessing step, not inside planetiler.
  #     preprocessing/utilities/dissolveBlocks_COD_duckdb.py does that,
  #     adapted from the existing dissolveBlocks_NGA_duckdb.py.
  #
  # Style-side follow-up needed (not done here): pmtiles/app/src/style.json's
  # "cod-settlement-extents" rule still points at the retired
  # "GRID3-COD-settlement-extents-v3-1" source-layer and field "type"; it
  # should be repointed at "GRID3-COD-settlement-extents-v4-0" / "extent_type".
  # "cod-settlement-blocks" still points at source-layer
  # "COD_blocks_20260624_with_cluster_ids"; repoint at
  # "GRID3-COD-settlement-blocks-v4-0".

  - id: GRID3-COD-settlement-blocks-v4-0
    features:
      - geometry: polygon
        source: cod_settlement_blocks
        min_zoom: 11
        attributes:
          - key: block_id
            type: string
          - key: country
            type: string
          - *attr_iso3
          - key: extent_type
            type: string
          - key: mgrs_code
            type: string
          - key: composite_class
            type: string
          - key: block_area_sqm
            type: double
          - key: block_perimeter
            type: double
          - key: building_count
            type: double
          - key: building_area_sum
            type: double
          - key: building_area_min
            type: double
          - key: building_area_max
            type: double
          - key: building_area_median
            type: double
          - key: building_area_stdev
            type: double
          - key: building_area_density
            type: double
          - key: building_count_density
            type: double
          - key: building_count_density_quantile_rank
            type: double
          - key: building_max_area_quantile_rank
            type: double
          - key: block_neighbor_count
            type: double
          - key: blocks_per_settl_extent
            type: double
          - key: ndvi_mean
            type: double
          - key: evi_mean
            type: double
          - key: gbuilding_max_height
            type: double
          - key: gbuilding_mean_height
            type: double

  - id: GRID3-COD-settlement-extents-v4-0
    features:
      - geometry: polygon
        source: cod_settlement_extents
        min_zoom: 7
        attributes:
          - key: mgrs_code
            type: string
          - key: country
            type: string
          - *attr_iso3
          - key: extent_type
            type: string
          - key: composite_class
            type: string
          - key: block_area_sqm
            type: double
          - key: block_perimeter
            type: double
          - key: building_count
            type: double
          - key: building_area_sum
            type: double
          - key: building_area_min
            type: double
          - key: building_area_max
            type: double
          - key: building_area_median
            type: double
          - key: building_area_stdev
            type: double
          - key: building_area_density
            type: double
          - key: building_count_density
            type: double
          - key: block_neighbor_count
            type: double
          - key: ndvi_mean
            type: double
          - key: evi_mean
            type: double
          - key: gbuilding_max_height
            type: double
          - key: gbuilding_mean_height
            type: double
          - key: dissolved_block_count
            type: double

  # ── Points of interest ─────────────────────────────────────────────────────
  # DOIs: 10.7916/77t0-h465 (health facilities), 10.7916/k9sy-hc13 (settlement
  # names), published 2026-01-13.
  # `lat`/`lon`/`precision_` are dropped — redundant with the point geometry
  # itself.

  - id: GRID3-COD-health-facilities-v9-0
    features:
      - geometry: point
        source: cod_health_facilities
        # Stepped by esstype, replicating tippecanoe's health_facilities_esstype
        # zoom_filter_windows. "otherwise" (any new/unlisted esstype) falls back
        # to the layer's base z5 rather than being silently dropped, which is a
        # deliberate deviation from the tippecanoe pipeline (there, values not
        # enumerated in any window never render at any zoom). Drop the
        # "5": "otherwise" arm if you want exact tippecanoe-equivalent behavior.
        min_zoom:
          match:
            "7": { esstype: ["Bureau Central de la Zone de Santé", "Hôpital Général de Référence"] }
            "9": { esstype: ["Hôpital", "Centre Hopitalier"] }
            "10": { esstype: ["Centre Médical", "Centre de Santé de Référence", "Centre de Santé", "Poste de Santé"] }
            "13": { esstype: ["Clinique", "Polyclinque", "Dispensaire", "Site Soin Communautaire", "Autre"] }
            "5": "otherwise"
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_airesante
          - *attr_as_uid
          - key: localite
            type: string
          - key: essnom1
            type: string
          - key: essnom2
            type: string
          - key: esstype
            type: string
          - key: typeorig
            type: string
          - key: dhis2
            type: string
          - key: categorie
            type: string
          - key: vaccfixe
            type: string
          - key: frigo
            type: string
          - key: frigofct
            type: string
          - *attr_date
          - *attr_source_acronym
          - key: origine
            type: string
          - *attr_grid3id
          - *attr_sourceid

  - id: GRID3-COD-settlement-names-v9-0
    features:
      - geometry: point
        source: cod_settlement_names
        min_zoom: 5
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_airesante
          - *attr_as_uid
          - key: localite
            type: string
          - key: localitetype
            type: string
          - key: localite_alt
            type: string
          - key: enclav
            type: string
          - key: enclavdate
            type: string
          - *attr_source_acronym
          - *attr_date
          - *attr_grid3id
          - *attr_sourceid

  # ── Roads ───────────────────────────────────────────────────────────────────
  # DOI: 10.7916/00gb-e164 (v1.0, published 2026-01-14).
  # `ORIG_FID` is dropped (Esri row-index artifact, not meaningful).
  # min_zoom is stepped by `class`, reusing tile_layer_steps.json's "roads"
  # zoom_filter_windows: motorway/trunk -> z5, primary -> z6, secondary -> z7,
  # tertiary -> z10, service/steps -> z13, and everything else (unclassified,
  # track, unknown, residential, path, footway, bridleway, cycleway,
  # pedestrian, living_street, water track, and any future/unlisted class)
  # -> z11, satisfying "tracks/paths visible from z11+".
  # tile_post_process.merge_line_strings does the heavy lifting for size:
  # it fuses touching same-attribute segments (collapsing GERS-style road
  # over-segmentation) and drops merged segments under ~2 tile pixels below
  # the max zoom, while keeping full detail at max zoom for overzooming.

  - id: GRID3-COD-roads-v1-0
    features:
      - geometry: line
        source: cod_roads
        min_zoom:
          match:
            "13": { class: ["service", "steps"] }
            "10": { class: "tertiary" }
            "7": { class: "secondary" }
            "6": { class: "primary" }
            "5": { class: ["motorway", "trunk"] }
            "11": "otherwise"
        attributes:
          - key: grid3_id
            type: string
          - key: gers
            type: string
          - key: country
            type: string
          - *attr_iso3
          - key: source_id
            type: string
          - key: class
            type: string
          - key: subclass
            type: string
          - key: names
            type: string
          - key: label
            type: string
          - key: road_surface
            type: string
          - key: speed_estimate
            type: double
          - key: speed_estimate_method
            type: string
          - key: speed_limits
            type: double
          - *attr_date
          - *attr_source_acronym
    tile_post_process:
      merge_line_strings:
        min_length: 2
        min_length_at_max_zoom: 0
        tolerance: 0.375
        tolerance_at_max_zoom: 0.1
        buffer: 4
