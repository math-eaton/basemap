# Planetiler custommap schema for GRID3's "latest" tileset: DRC (COD)
# administrative, settlement, health-facility, and roads layers, plus the
# sub-continental Africa-wide settlement extents layer.
#
# Derived from:
#   - planetiler/reports/ogrreport_202608191340.json (COD field/geometry inventory)
#   - planetiler/reports/ogrreport_202608191438.json (COD roads field/geometry inventory)
#   - planetiler/reports/ogrreport_202608241303.json (Africa settlement extents inventory)
#   - preprocessing/profiles/cod/layers.yaml           (v9.0 layer ids, min/maxzoom, DOIs)
#   - preprocessing/dictionaries/tile_layer_steps.json (zoom-stepped attribute filters)
#   - preprocessing/dictionaries/layer_metadata.json   (attribution/license precedent)
#   - pmtiles/app/src/style.json                       (confirms layer id "GRID3-COD-roads-v1-0",
#     attribute "class", and the old "type" field on settlement extents are already
#     relied on downstream by existing paint rules)
# against planetiler/schema/specifications/planetiler.schema.json and
# https://github.com/onthegomap/planetiler/tree/main/planetiler-custommap
#
# NOTE — available `args:` (YAML-only, no CLI flags needed): everything below
# is settable directly in this file's `args:` block per the schema's `$defs.args`
# (planetiler/schema/specifications/planetiler.schema.json lines 147-378) —
# you shouldn't need extra `--flag`s at the command line for any of these:
#   threads, write_threads, process_threads, feature_read_threads,
#   minzoom, maxzoom, render_maxzoom,
#   force, gzip_temp, mmap_temp,
#   point_label_grid (pixel_size / limit, both by maxzoom+value),
#   sort_max_readers, sort_max_writers,
#   nodemap_type, nodemap_storage, nodemap_madvise,
#   multipolygon_geometry_storage, multipolygon_geometry_madvise,
#   http_user_agent, http_retries, download_chunk_size_mb, download_threads,
#   download_max_bandwidth,
#   min_feature_size_at_max_zoom, min_feature_size,
#   simplify_tolerance_at_max_zoom, simplify_tolerance (GLOBAL defaults —
#     per-feature `tolerance`/`tolerance_at_max_zoom` below override these
#     per layer where set),
#   skip_filled_tiles, tile_warning_size_mb.
# `args:` also accepts arbitrary custom keys (e.g. `data_dir` below) exposed
# as `${ args.<name> }` in expressions and as `--<name>` CLI overrides if you
# ever do need one. `maxzoom` was removed from this revision, so planetiler's
# built-in default (14) applies — still fine here since the deepest zoom-step
# used anywhere below is z13 (health facilities), but bump it back if that
# changes.
#
# NOTE — no topology-preserving joint simplification: there's no mechanism in
# the custommap YAML DSL (checked the full schema surface — sources/layers/
# features/tile_post_process, nothing else) to simplify two different layers'
# polygons "together" so shared/nested edges stay aligned — planetiler
# simplifies each layer's geometry independently, per output tile.
# `tile_post_process` (merge_line_strings/merge_polygons) doesn't help either:
# it only fuses same-attribute geometries that are already touching within
# ONE layer's ONE tile, it has no concept of a different layer's boundary.
# That's why the province/antenne/zonesante/airesante hierarchy below uses the
# graduated-tolerance-by-nesting-depth mitigation instead (see the polygon
# simplification NOTE further down) — it's the best available approximation
# purely from YAML. A byte-exact shared edge would require true topological
# simplification (e.g. mapshaper -simplify with shared arcs, or a topojson
# round-trip) done as a preprocessing step before planetiler ever sees the
# data — not expressible in this schema.
#
# IMPORTANT — source format:
# Planetiler custommap only reads `osm`, `shapefile`, `geopackage`, or `geojson`
# sources; FlatGeobuf is not supported. Convert each input .fgb to GeoPackage
# before running planetiler, e.g.:
#
#   for f in *.fgb; do
#     ogr2ogr -f GPKG "${f%.fgb}.gpkg" "$f"
#   done
#
# All inputs are already EPSG:4326 (confirmed via ogrinfo), so no reprojection
# or `projection:` override is needed.
#
# NOTE — derived centroids: the separately pre-computed `*_centroids` inputs
# (province/antenne/zonesante/airesante) are no longer needed. Those layers now
# use `geometry: polygon_centroid_if_convex` directly on the polygon sources —
# it emits the true centroid for convex polygons and falls back to an interior
# point for concave ones, so the label point always lands inside the shape.
# One tradeoff: the precomputed centroid files carried an Esri-derived
# `label_rotation` field with no equivalent computable from the polygon alone,
# so that attribute is dropped from these layers.
#
# NOTE — no per-layer maxzoom: unlike tippecanoe's per-`-L` maxzoom, planetiler
# custommap has no per-feature/per-layer max_zoom concept — only a single global
# `--maxzoom` (`args.maxzoom`, currently unset so planetiler's built-in default
# of 14 applies — see the `args:` NOTE above). Every layer's geometry renders
# unchanged at every zoom from its own min_zoom up through the global maxzoom
# (harmless for polygons/lines — vector tile clients overzoom anyway).
#
# NOTE — polygon simplification tolerances: added to keep vector-tile vertex
# counts (and MapLibre's 65535-vertex-per-bucket fill limit) in check without
# distorting the shapes that matter cartographically.
#
#   - Administrative boundaries (province/antenne/zonesante/airesante) must
#     nest — airesante inside zonesante inside antenne inside province — but
#     planetiler simplifies each layer's polygons independently (there's no
#     shared-boundary/topological simplification across layers), so exactly
#     matching edges can't be guaranteed. The mitigation used here is to keep
#     tolerances small and graduated by nesting depth: the most-nested layer
#     (airesante) gets the tightest tolerance (hugs the true line closely),
#     and each parent level a bit looser than its child. That bounds the
#     worst-case parent/child divergence to roughly the parent's own
#     tolerance (well under a couple of pixels — imperceptible at render
#     scale) rather than letting a heavily-simplified parent and a barely-
#     simplified child drift apart independently. This is a "moderate"
#     simplification per the source request, well below what settlement
#     extents use.
#   - Settlement extents are a zoomed-out (z7-10-ish) generalized overview,
#     so they can take a more aggressive tolerance plus a small `min_size`
#     to drop slivers too small to matter at that scale — dropping a whole
#     tiny extent polygon here is fine, it's just noise at overview scale.
#   - Settlement blocks are the opposite case: they're meant to read as a
#     contiguous "city block" mosaic, so simplification must stay
#     conservative (small tolerance only, to remove sub-pixel jitter) and
#     `min_size` is deliberately NOT used — dropping a whole block feature
#     would leave a visible hole in the mosaic, which is the one thing this
#     layer isn't allowed to do.
#
# NOTE — roads layer: the source file is renamed from the awkward
# `GRID3_COD_roads_v1_0_4326.fgb` to `GRID3_COD_roads_v1_0.gpkg` during
# conversion (the "_4326" EPSG suffix is redundant — every input here is
# already EPSG:4326). The layer id `GRID3-COD-roads-v1-0` and the `class`
# attribute are kept exactly as-is because pmtiles/app/src/style.json already
# paints against them (grid3-cod-tracks, grid3-cod-roads-minor, etc.).
# Zoom-stepping by `class` reuses the already-vetted "roads" zoom_filter_windows
# from tile_layer_steps.json, restructured as a match with a catch-all
# "otherwise" at z11 so track/path/unclassified/residential (and any future,
# currently-unlisted class) all render starting at z11 as requested; only
# higher-priority classes (motorway/trunk/primary/secondary/tertiary) get an
# earlier explicit zoom, and service/steps are pushed to z13. Feature count is
# aggressively cut via `tile_post_process.merge_line_strings`, which fuses
# contiguous same-attribute segments (this dataset carries Overture GERS-style
# road segmentation, so many of the 1.86M rows are short fragments of the same
# logical road) and drops merged segments under ~2px below max zoom. Per-
# planetiler's schema, feature-level `min_size`/`tolerance` are ignored once a
# layer defines `tile_post_process`, so simplification is controlled solely
# through the tile_post_process block here.

schema_name: "GRID3 Latest"
schema_description: >-
  GRID3 DRC (COD) administrative boundaries (province, antenne, health zone,
  health area), settlement extents/blocks, health facilities, settlement-name
  points, and roads, plus the sub-continental Africa-wide settlement extents
  overview layer (excluding COD/NGA, which have their own newer datasets
  above), produced by GRID3 / CIESIN.
attribution: "© The Trustees of Columbia University in the City of New York. CC BY-SA 4.0."
version: "latest"
is_overlay: true

args:
  data_dir:
    type: string
    default: "/tmp/grid3_tiles/data/2-scratch/grid3/cod/gpkg"
    description: "Directory of GeoPackage source data."


definitions:
  attributes:
    - &attr_pays { key: pays, type: string }
    - &attr_iso3 { key: iso3, type: string }
    - &attr_province { key: province, type: string }
    - &attr_prov_uid { key: prov_uid, type: string }
    - &attr_antenne { key: antenne, type: string }
    - &attr_zonesante { key: zonesante, type: string }
    - &attr_zs_uid { key: zs_uid, type: string }
    - &attr_airesante { key: airesante, type: string }
    - &attr_as_uid { key: as_uid, type: string }
    - &attr_date { key: date, type: string }
    - &attr_edit_par { key: edit_par, type: string }
    - &attr_grid3id { key: grid3id, type: string }
    - &attr_source_acronym { key: source_acronym, type: string }
    - &attr_sourceid { key: sourceid, type: string }
    - &attr_area_km2 { key: bbox_km2, value: '${ feature.bbox.area("km2") }', type: double }

sources:
  cod_province:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_province_v9_0.gpkg" }'
  cod_antenne:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_antenne_v9_0.gpkg" }'
  cod_zonesante:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_zonesante_v9_0.gpkg" }'
  cod_airesante:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_airesante_v9_0.gpkg" }'
  cod_settlement_blocks:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_settlement_blocks_v4_0.gpkg" }'
  cod_settlement_extents:
    type: geopackage
    # Produced by preprocessing/utilities/dissolveBlocks_COD_duckdb.py, which
    # dissolves cod_settlement_blocks by mgrs_code with proper SUM/AVG/MIN/MAX
    # aggregation (the same pattern already used for NGA in
    # dissolveBlocks_NGA_duckdb.py). Not a raw ogr2ogr conversion of an .fgb —
    # this file must be generated by that script.
    local_path: '${ args.data_dir + "/GRID3_COD_settlement_extents_v4_0.gpkg" }'
  cod_health_facilities:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_health_facilities_v9_0.gpkg" }'
  cod_settlement_names:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_settlement_names_v9_0.gpkg" }'
  cod_roads:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_COD_roads_v1_0.gpkg" }'
  africa_settlement_extents:
    type: geopackage
    local_path: '${ args.data_dir + "/GRID3_AFRICA_settlement_extents_v3_0.gpkg" }'

layers:

  # ── Administrative boundaries ──────────────────────────────────────────────
  # DOIs: 10.7916/06qw-9y10, 10.7916/hv5g-p227 (published 2026-01-13)

  - id: GRID3-COD-province-v9-0
    features:
      - geometry: polygon
        source: cod_province
        min_zoom: 3
        attributes:
          - *attr_province
          - *attr_pays
          - *attr_iso3
          - *attr_prov_uid
          - *attr_date
          - *attr_edit_par
          - *attr_grid3id

  - id: GRID3-COD-province-v9-0-centroids
    features:
      - geometry: polygon_centroid_if_convex
        source: cod_province
        min_zoom: 3
        attributes:
          - *attr_province
          - *attr_pays
          - *attr_iso3
          - *attr_prov_uid
          - *attr_date
          - *attr_edit_par
          - *attr_grid3id
          - *attr_area_km2

  - id: GRID3-COD-antenne-v9-0
    features:
      - geometry: polygon
        source: cod_antenne
        min_zoom: 3
        attributes:
          - *attr_antenne
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_date
          - *attr_edit_par
          - *attr_grid3id

  - id: GRID3-COD-antenne-v9-0-centroids
    features:
      - geometry: polygon_centroid_if_convex
        source: cod_antenne
        min_zoom: 3
        attributes:
          - *attr_antenne
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_date
          - *attr_edit_par
          - *attr_grid3id
          - *attr_area_km2

  - id: GRID3-COD-zonesante-v9-0
    features:
      - geometry: polygon
        source: cod_zonesante
        min_zoom: 5
        tolerance: 0.2
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_date
          - *attr_source_acronym
          - *attr_sourceid
          - *attr_edit_par
          - *attr_grid3id

  - id: GRID3-COD-zonesante-v9-0-centroids
    features:
      - geometry: polygon_centroid_if_convex
        source: cod_zonesante
        min_zoom: 5
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_date
          - *attr_source_acronym
          - *attr_sourceid
          - *attr_edit_par
          - *attr_grid3id
          - *attr_area_km2

  - id: GRID3-COD-airesante-v9-0
    features:
      - geometry: polygon
        source: cod_airesante
        min_zoom: 7
        tolerance: 0.5
        tolerance_at_max_zoom: 0.1
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_airesante
          - *attr_as_uid
          - key: asnom_alt
            type: string
          - *attr_date
          - *attr_source_acronym
          - *attr_sourceid
          - *attr_edit_par
          - *attr_grid3id

  - id: GRID3-COD-airesante-v9-0-centroids
    features:
      - geometry: polygon_centroid_if_convex
        source: cod_airesante
        min_zoom: 7
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
          - *attr_zs_uid
          - *attr_airesante
          - *attr_as_uid
          - key: asnom_alt
            type: string
          - *attr_date
          - *attr_source_acronym
          - *attr_sourceid
          - *attr_edit_par
          - *attr_grid3id
          - *attr_area_km2

  # ── Settlement extents / blocks ────────────────────────────────────────────
  # DOI: 10.7916/bb5b-9b79 (v4.0, published 2026-04-03) for both layers below.
  #
  # Two-tier split, mirroring the NGA precedent already in
  # pmtiles/app/src/style.json (GRID3-NGA-settlement-extents-v4-0 at z7-14
  # crossfading into GRID3-NGA-settlement-blocks-v4-0 at z11+) and the old
  # tippecanoe layers.yaml GRID3_COD_settlement_blocks group (minzoom 11):
  #
  #   - GRID3-COD-settlement-blocks-v4-0: the raw per-block data (1.15M rows,
  #     one polygon per building cluster), z11+ only — "this existing paradigm
  #     .. used at larger scales only (>~11)".
  #   - GRID3-COD-settlement-extents-v4-0: a generalized z7-10 view, one
  #     polygon per mgrs_code, produced by dissolving+aggregating the blocks
  #     layer ahead of time (see cod_settlement_extents source
  #     above). Planetiler's tile_post_process.merge_polygons only fuses
  #     polygons that already share an identical attribute set within a single
  #     output tile — it can't compute cross-feature aggregates (sums/means)
  #     or dissolve across tile boundaries, so a true group-by-mgrs_code
  #     dissolve has to happen as a preprocessing step, not inside planetiler.
  #     preprocessing/utilities/dissolveBlocks_COD_duckdb.py does that,
  #     adapted from the existing dissolveBlocks_NGA_duckdb.py.
  #
  # Style-side follow-up needed (not done here): pmtiles/app/src/style.json's
  # "cod-settlement-extents" rule still points at the retired
  # "GRID3-COD-settlement-extents-v3-1" source-layer and field "type"; it
  # should be repointed at "GRID3-COD-settlement-extents-v4-0" / "extent_type".
  # "cod-settlement-blocks" still points at source-layer
  # "COD_blocks_20260624_with_cluster_ids"; repoint at
  # "GRID3-COD-settlement-blocks-v4-0".

  - id: GRID3-COD-settlement-blocks-v4-0
    features:
      - geometry: polygon
        source: cod_settlement_blocks
        min_zoom: 11
        # Conservative on purpose — see the polygon-simplification NOTE above.
        # No min_size here: dropping a whole block feature would punch a
        # visible hole in what's supposed to be a contiguous block mosaic.
        tolerance: 0.5
        tolerance_at_max_zoom: 0.1
        attributes:
          - key: block_id
            type: string
          - key: country
            type: string
          - *attr_iso3
          - key: extent_type
            type: string
          - key: mgrs_code
            type: string
          - key: composite_class
            type: string
          - key: block_area_sqm
            type: double
          - key: block_perimeter
            type: double
          - key: building_count
            type: double
          - key: building_area_sum
            type: double
          - key: building_area_min
            type: double
          - key: building_area_max
            type: double
          - key: building_area_median
            type: double
          - key: building_area_stdev
            type: double
          - key: building_area_density
            type: double
          - key: building_count_density
            type: double
          - key: building_count_density_quantile_rank
            type: double
          - key: building_max_area_quantile_rank
            type: double
          - key: block_neighbor_count
            type: double
          - key: blocks_per_settl_extent
            type: double
          - key: ndvi_mean
            type: double
          - key: evi_mean
            type: double
          - key: gbuilding_max_height
            type: double
          - key: gbuilding_mean_height
            type: double

  - id: GRID3-COD-settlement-extents-v4-0
    features:
      - geometry: polygon
        source: cod_settlement_extents
        min_zoom: 7
        # This is a generalized overview layer, so it can take a more
        # aggressive tolerance than the blocks it's dissolved from, plus a
        # min_size to drop slivers that are noise at z7-10 scale. Full detail
        # is kept at max zoom (min_size_at_max_zoom: 0) for overzooming.
        tolerance: 0.5
        tolerance_at_max_zoom: 0.1
        min_size: 2
        min_size_at_max_zoom: 0
        attributes:
          - key: mgrs_code
            type: string
          - key: country
            type: string
          - *attr_iso3
          - key: extent_type
            type: string
          - key: composite_class
            type: string
          - key: block_area_sqm
            type: double
          - key: block_perimeter
            type: double
          - key: building_count
            type: double
          - key: building_area_sum
            type: double
          - key: building_area_min
            type: double
          - key: building_area_max
            type: double
          - key: building_area_median
            type: double
          - key: building_area_stdev
            type: double
          - key: building_area_density
            type: double
          - key: building_count_density
            type: double
          - key: block_neighbor_count
            type: double
          - key: ndvi_mean
            type: double
          - key: evi_mean
            type: double
          - key: gbuilding_max_height
            type: double
          - key: gbuilding_mean_height
            type: double
          - key: dissolved_block_count
            type: double

  # ── Africa-wide settlement extents ─────────────────────────────────────────
  # DOI: unknown/TBD — not found in preprocessing/dictionaries/layer_metadata.json
  # or layers.yaml; fill in when available.
  # 9,278,965 input rows continent-wide. Same "type" field (Built-up Area /
  # Small Settlement Area / Hamlet) and zoom-stepping precedent as the old
  # COD v3.1 extents layer (pmtiles/app/src/style.json's "cod-settlement-extents"
  # rule used this exact field/value set), reused here as-is.
  # COD and NGA are excluded via `exclude_when` — those two countries have
  # their own newer datasets already defined above (GRID3-COD-settlement-
  # extents/blocks-v4-0) and a GRID3-NGA equivalent outside this file's scope.
  # Per your instruction this filters on the `country` field specifically
  # (values 'COD'/'NGA') — note the source also carries a separate `iso3`
  # field if that's actually the one meant to hold those codes; let me know if
  # you'd rather filter on that instead.
  # `Shape_Length`/`Shape_Area` (Esri-computed, EPSG:4326-degree units) are
  # dropped, consistent with how the other Esri geometry artifacts in this
  # file are handled.

  - id: GRID3-AFRICA-settlement-extents-v3-0
    features:
      - geometry: polygon
        source: africa_settlement_extents
        exclude_when:
          country: ["COD", "NGA"]
        min_zoom:
          match:
            "10": { type: "Small Settlement Area" }
            "12": { type: "Hamlet" }
            "7": "otherwise"
        tolerance: 0.5
        tolerance_at_max_zoom: 0.1
        min_size: 2
        min_size_at_max_zoom: 0
        attributes:
          - key: country
            type: string
          - *attr_iso3
          - key: type
            type: string
          - key: mgrs_code
            type: string
          - key: building_count
            type: long
          - key: building_area
            type: double
          - key: probability
            type: double
          - key: date
            type: string
          - key: source
            type: string

  # ── Points of interest ─────────────────────────────────────────────────────
  # DOIs: 10.7916/77t0-h465 (health facilities), 10.7916/k9sy-hc13 (settlement
  # names), published 2026-01-13.
  # `lat`/`lon`/`precision_` are dropped — redundant with the point geometry
  # itself.

  - id: GRID3-COD-health-facilities-v9-0
    features:
      - geometry: point
        source: cod_health_facilities
        # Stepped by esstype, replicating tippecanoe's health_facilities_esstype
        # zoom_filter_windows. "otherwise" (any new/unlisted esstype) falls back
        # to the layer's base z5 rather than being silently dropped, which is a
        # deliberate deviation from the tippecanoe pipeline (there, values not
        # enumerated in any window never render at any zoom). Drop the
        # "5": "otherwise" arm if you want exact tippecanoe-equivalent behavior.
        # FIXED: this previously had two "8" keys in the same match (one for
        # the Bureau/Hôpital tier, one for "otherwise") — YAML mappings can't
        # have duplicate keys, so PyYAML silently kept only the last one and
        # dropped the Bureau/Hôpital tier entirely. Restored "otherwise" to 5
        # (its original value) so both arms survive; bump the explicit tier
        # back to 7 too if that wasn't an intentional change.
        min_zoom:
          match:
            "8": { esstype: ["Bureau Central de la Zone de Santé", "Hôpital Général de Référence"] }
            "9": { esstype: ["Hôpital", "Centre Hopitalier"] }
            "10": { esstype: ["Centre Médical", "Centre de Santé de Référence", "Centre de Santé", "Poste de Santé"] }
            "13": { esstype: ["Clinique", "Polyclinque", "Dispensaire", "Site Soin Communautaire", "Autre"] }
            "5": "otherwise"
        attributes:
          - *attr_pays
          - *attr_iso3
          - *attr_province
          - *attr_prov_uid
          - *attr_antenne
          - *attr_zonesante
